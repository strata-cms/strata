developer_instructions = """
Read AGENTS.md, docs/ai/architecture.md, and docs/ai/infrastructure.md. Review
only for architectural integrity; do not edit files.

Check dependency direction/Import Linter contracts; Django ORM, QuerySet,
persistence-record and transaction leakage; explicit entity-record mapping;
repository and Unit-of-Work ownership; query DTO boundaries; service-layer use
across admin/API/CLI/worker; immutable revisions/draft-published isolation; ADR
0002 Content/Revision pointer semantics, optimistic version checks and
revision-number serialization;
stable UUID/namespaced identities; ADR 0003 plugin builder/compile/freeze, dependency ordering/version checks, owner-scoped registrar and public plugin API; typed schema migration/normalization; ADR 0004 structured block envelopes, stable block IDs, named slot/type/cardinality/depth constraints, recursive block schema migration/Delivery rendering and declared cross-plugin block dependencies; ADR 0005 schema-driven editor metadata, ephemeral working documents, Management API optimistic writes, and Admin avoiding ModelForm/record mutation;
persisted-schema evolution; Delivery vs Management API/lost-update semantics;
rebuildable projections; cache/search/message/task/storage/clock port boundaries;
event-vs-task-vs-broker semantics; transactional outbox reliability;
at-least-once/idempotent message handling; optional-provider isolation; and
premature/runtime-defined abstractions.

Report concrete findings with severity, file/line, violated invariant,
failure/evolution scenario, and practical remediation. If none, state that and
list unverified assumptions.
