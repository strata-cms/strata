services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      gunicorn strata_cms.config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SETTINGS_MODULE: strata_cms.config.settings.local
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only-secret-change-in-production-0123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgresql://strata:strata@db:5432/strata
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py strata_worker"
    environment:
      DJANGO_SETTINGS_MODULE: strata_cms.config.settings.local
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only-secret-change-in-production-0123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgresql://strata:strata@db:5432/strata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
